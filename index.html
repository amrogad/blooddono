<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BloodDono — give blood, save a life</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script>
      // Resolve the saved/system color scheme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('color-scheme');
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
      // Resolve the saved language before first paint to avoid a flash of the wrong direction.
      try {
        var l = localStorage.getItem('app-locale') === 'ar' ? 'ar' : 'en';
        document.documentElement.setAttribute('lang', l);
        document.documentElement.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
